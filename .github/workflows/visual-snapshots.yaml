name: visual-snapshots

# Regera os prints de referência da regressão visual (tests/e2e/__screenshots__) e commita.
# Rodar depois de uma mudança visual intencional; o CI compara contra esses prints.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Instala dependências
        run: pnpm install --frozen-lockfile
      - name: Gera os prints
        run: pnpm test:e2e visual --update-snapshots=all
        env:
          CI: "true"
      - name: Commita se mudou
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/__screenshots__
          if git diff --cached --quiet; then echo "prints iguais"; exit 0; fi
          git commit -m "test(visual): update reference screenshots"
          git push
