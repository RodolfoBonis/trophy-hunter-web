# Release da imagem trophy-hunter-web: build + push no ECR (sa-east-1, conta 718446585908) e bump da
# tag no repo de manifests (RodolfoBonis/k3s-apps → apps/trophy-hunter-web/values-prod.yaml). O
# ArgoCD do cluster rblab sincroniza o deploy a partir do manifest.
#
# Dispare por tag `v*` (a tag sem o "v" vira o tag da imagem) ou manualmente:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Secrets: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION (push no ECR),
#          GH_TOKEN (push no RodolfoBonis/k3s-apps).
name: image-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag da imagem (ex.: 0.1.0)."
        required: true

permissions:
  contents: read

concurrency:
  group: image-release
  cancel-in-progress: false

env:
  ECR_REGISTRY: 718446585908.dkr.ecr.sa-east-1.amazonaws.com
  ECR_REPOSITORY: rodolfobonis/trophy-hunter-web
  MANIFEST_REPO: RodolfoBonis/k3s-apps
  VALUES_FILE: apps/trophy-hunter-web/values-prod.yaml

jobs:
  build-push-bump:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
    runs-on: arc-trophy-hunter-web
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve e valida a versão da imagem
        id: ver
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then IMG="$INPUT_TAG"; else IMG="${GITHUB_REF_NAME#v}"; fi
          if ! printf '%s' "$IMG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag de imagem inválida: '$IMG' (esperado semver, ex.: 0.1.0)"
            exit 1
          fi
          echo "image=$IMG" >> "$GITHUB_OUTPUT"

      - name: Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login no ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Garante o repositório no ECR
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_REPOSITORY" \
                 --image-scanning-configuration scanOnPush=true >/dev/null

      - uses: docker/setup-buildx-action@v3

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.image }}
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.ver.outputs.image }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bump da imagem no repo de manifests (ArgoCD sincroniza)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          IMAGE_TAG: ${{ steps.ver.outputs.image }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${MANIFEST_REPO}.git" k3s
          cd k3s
          if [ ! -f "$VALUES_FILE" ]; then
            echo "::error::$VALUES_FILE não existe no ${MANIFEST_REPO} — crie os manifests antes do primeiro release."
            exit 1
          fi
          # Atualiza a tag da imagem do web-server (chave web-server.image.tag no values do rb-stack).
          go install github.com/mikefarah/yq/v4@latest >/dev/null 2>&1 || true
          export PATH="$PATH:$(go env GOPATH)/bin"
          if command -v yq >/dev/null 2>&1; then
            yq -i ".web-server.image.tag = \"${IMAGE_TAG}\"" "$VALUES_FILE"
          else
            sed -i -E "s/^(\s*tag:\s*).*/\1\"${IMAGE_TAG}\"/" "$VALUES_FILE"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$VALUES_FILE"
          if git diff --cached --quiet; then echo "manifest já está em ${IMAGE_TAG}"; exit 0; fi
          git commit -m "deploy(trophy-hunter-web): ${IMAGE_TAG}"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push falhou (tentativa $attempt), tentando de novo"; sleep 5
          done
          exit 1
