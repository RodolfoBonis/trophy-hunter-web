# CI de PR/main: qualidade (typecheck, lint, unit, build), e2e com API mockada e build da imagem.
# Não publica nada — release é o image-release.yaml (tags v*).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Instala dependências
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Testes unitários e de componente
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Orçamento do carregamento inicial (JS/CSS gzip e fontes)
        run: pnpm check:bundle

  e2e:
    runs-on: ubuntu-latest
    # Mesma imagem que gera os prints de referência (visual-snapshots.yaml): fonte/render idênticos.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Instala dependências
        run: pnpm install --frozen-lockfile
      - name: Playwright (API mockada com MSW)
        run: pnpm test:e2e
        env:
          CI: "true"
      - name: Relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Instala dependências
        run: pnpm install --frozen-lockfile
      - name: Build (modo mock)
        run: pnpm build:e2e
      - name: Lighthouse (celular, CLS barra; LCP/nota como aviso — ver lighthouserc.cjs)
        run: npx -y @lhci/cli@0.15.1 autorun --config=lighthouserc.cjs
      - name: Relatório do Lighthouse
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report
          retention-days: 14

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build da imagem (sem push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: trophy-hunter-web:ci
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke do container (config.js, healthz, SPA fallback, CSP)
        run: |
          docker run -d --name web -p 8080:8080 --read-only --tmpfs /tmp \
            -e OIDC_AUTHORITY=https://auth.rb.lab/realms/platform \
            -e API_BASE_URL=https://api.rodolfodebonis.com.br/trophy \
            trophy-hunter-web:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/config.js | grep -q 'trophy-hunter-web'
          curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:8080/library | grep -q 200
          curl -fsSI http://localhost:8080/ | grep -qi 'content-security-policy'
          curl -fsSI http://localhost:8080/ | grep -i 'content-security-policy' | grep -q 'connect-src[^;]*steamstatic'
          curl -fsS http://localhost:8080/config.js | grep -q 'apiBase: "https://api.rodolfodebonis.com.br/trophy"'
          curl -fsSI http://localhost:8080/ | grep -i 'content-security-policy' | grep -q 'connect-src .*https://api.rodolfodebonis.com.br '
          docker rm -f web
      # O e2e roda em modo mock; aqui o build de PRODUÇÃO precisa bootar de verdade num navegador
      # (incidente 0.25.0: ordem dos chunks quebrou o boot só em produção).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Instala dependências e o Chromium
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - name: Boot do build de produção no navegador (sem erro de JS, chega no login e na API pública)
        run: |
          docker run -d --name boot -p 8081:8080 --read-only --tmpfs /tmp \
            -e OIDC_AUTHORITY=https://auth.example.test/realms/smoke \
            -e API_BASE_URL=https://api.example.test/trophy \
            trophy-hunter-web:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8081/healthz && break; sleep 1; done
          node tests/smoke/boot-prod.mjs http://localhost:8081 https://auth.example.test https://api.example.test/trophy
          docker rm -f boot
